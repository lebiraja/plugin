# Production compose: runs the published single app image from Docker Hub.
#
#   IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d
#
# Provide a .env with at least ENCRYPTION_KEY (to enable cloud providers) and any
# bootstrap provider keys (OPENAI_API_KEY, …).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  mongodb:
    image: mongo:7
    container_name: mongodb-server
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  app:
    image: lebiraja/plugin:${IMAGE_TAG:-latest}
    container_name: plugin-app
    ports:
      - "3100:80"
    volumes:
      - app_uploads:/app/backend/uploads
      - app_vector_db:/app/backend/vector_db
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434
      - MONGODB_URL=mongodb://admin:${MONGO_PASSWORD:-password}@mongodb:27017/
      - MONGODB_DB_NAME=plugin_chat_db
      - VECTOR_DB_PATH=/app/backend/vector_db
      - UPLOAD_DIR=/app/backend/uploads
      - CORS_ORIGINS=http://localhost:3100
    depends_on:
      ollama:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/api/health", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ollama_data:
  mongodb_data:
  app_uploads:
  app_vector_db:

networks:
  app-network:
    driver: bridge
