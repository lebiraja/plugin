version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  mongodb:
    image: mongo:7
    container_name: mongodb-server
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend-server
    ports:
      - "2000:2000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/vector_db:/app/vector_db
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Service-name overrides for the Docker network. These take precedence
      # over .env and match the aliases declared in backend/config.py.
      - OLLAMA_URL=http://ollama:11434
      - LMSTUDIO_URL=http://lmstudio:1234
      - MONGODB_URL=mongodb://admin:password@mongodb:27017/
      - MONGODB_DB_NAME=plugin_chat_db
      - VECTOR_DB_PATH=/app/vector_db
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3100,http://localhost:5173
    depends_on:
      ollama:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Relative base so the nginx reverse proxy (see nginx.conf) forwards
        # /api to the backend. No CORS, no hardcoded host.
        VITE_API_URL: /api
    container_name: frontend-server
    ports:
      - "3100:80"
    depends_on:
      - backend
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/", "-o", "/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ollama_data:
  mongodb_data:

networks:
  app-network:
    driver: bridge


